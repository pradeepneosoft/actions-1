name: Run Muliple jobs

on: push

jobs:
    build_job_1:
        runs-on: ubuntu-latest
        steps:
        
        - name: Install cowsey program
          run: sudo apt-get install cowsay -y
       
        - name: Execute cowsey cmd 
          run: cowsay -f dragon "Run for cover, I am a DRAGON....RAWR" >> dragon.txt

        - name: Sleep for 10 sec
          run: sleep 10
    
    test_job_2:
        needs: build_job_1
        runs-on: ubuntu-latest
        steps:
        - name: sleep for 10 sec 
          run: sleep 10

        - name: Test file exists
          run: grep -irn "dragon" dragon.txt

    deploy_job_3: 
        needs: test_job_2

        runs-on: ubuntu-latest
        steps:
        
        - name: Read file
          run: cat dragon.txt
        
        - name: Deploy
          run: echo Deploying .....

