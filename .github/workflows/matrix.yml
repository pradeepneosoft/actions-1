name: matrix strategy

on:
    workflow_dispatch:
    push:

jobs:
    build:
        strategy:
            fail-fast: false
            max-parallel: 2
            matrix:
                os: [ubuntu-latest, windows-latest, ubuntu-20.04]
                image: [hello-world, alpine]
                exclude:
                    - image: alpine
                      os: windows-latest
                include:
                    - image: amd64/hello-world
                      os: ubuntu-20.04
        runs-on: ${{ matrix.os }}
        steps:
        - name: echo docker details
          run: |
            echo Running on ${{ matrix.os }}
            docker --version
        - name: Run Image on ${{ matrix.image }}
          run: |
            docker run  ${{ matrix.image }}
