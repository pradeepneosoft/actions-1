name: Excuting shell script

on: push

jobs:
    first_job:
        runs-on: ubuntu-latest
        steps:
        - name: checkout repo
          uses: actions/checkout@v6
        
        - name: list repo files
          run: ls -ltra
        
        - name: Execute shell script
          run: |
            sudo chmod +x ascii-script.sh
            ./ascii-script.sh
        
