name: expression testing
on: push
jobs:
  first-job:   
    runs-on: ubuntu-latest
    steps:
      - name: Dump github context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"
  second-job:   
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: runs only on feature branch
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"